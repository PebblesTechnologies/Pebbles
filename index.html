<style>
  :root{

  }

  .hero-tint{
    position:absolute;
    inset:0;
    background-color:rgba(241,238,224,0.35);
    background-image:
      radial-gradient(1200px 520px at 84% -12%, rgba(51,107,90,0.16), transparent 62%),
      radial-gradient(900px 460px at -6% 8%, rgba(156,133,82,0.14), transparent 58%),
      radial-gradient(700px 380px at 40% 120%, rgba(17,41,34,0.10), transparent 60%);
    z-index:1;
    pointer-events:none;
  }
  .hero-inner{
    position:relative;
    z-index:2;
    max-width:640px;
    width:100%;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .brand{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    margin-bottom:clamp(20px,4vh,34px);
  }
  .brand img{height:clamp(100px,13vh,140px); width:auto;}
  .brand span{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(16px,2vw,20px);
    letter-spacing:0.04em;
    color:var(--navy);
    text-transform:uppercase;
  }
  .coming-soon{
    font-size:clamp(36px, 6.5vw, 78px);
    font-weight:600;
    color:var(--navy);
    letter-spacing:-0.01em;
  }
  .location{
    margin-top:12px;
    font-family:'Work Sans', sans-serif;
    font-size:clamp(13px, 1.5vw, 16px);
    font-weight:500;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--water);
  }
  .location::before{
    content:"";
    display:inline-block;
    width:20px;height:2px;
    background:var(--gold);
    margin-right:10px;
    vertical-align:middle;
  }
  .location::after{
    content:"";
    display:inline-block;
    width:20px;height:2px;
    background:var(--gold);
    margin-left:10px;
    vertical-align:middle;
  }
  .tagline{
    margin-top:clamp(20px,3.5vh,30px);
    font-family:'Fraunces', serif;
    font-weight:500;
    font-style:italic;
    font-size:clamp(19px, 2.8vw, 28px);
    color:var(--ink);
    max-width:460px;
  }

  .sectors{
    margin-top:clamp(32px,5.5vh,48px);
    display:flex;
    gap:24px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .sector-circle{
    width:clamp(110px,14vw,142px);
    height:clamp(110px,14vw,142px);
    border-radius:50%;
    background:var(--white);
    border:1px solid var(--line);
    box-shadow:var(--shadow);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:12px;
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .sector-circle:hover{
    transform:translateY(-4px);
    box-shadow:0 16px 36px rgba(17,41,34,0.2);
  }
  .sector-circle span{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(13px,1.4vw,15px);
    color:var(--navy);
    letter-spacing:0.01em;
  }

  .scroll-hint{
    position:absolute;
    z-index:2;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }
  .scroll-hint .chevron{
    width:9px;height:9px;
    border-right:1.5px solid var(--water);
    border-bottom:1.5px solid var(--water);
    transform:rotate(45deg);
    animation:bounce 2s infinite;
  }
  @keyframes bounce{
    0%,100%{transform:translateY(0) rotate(45deg);}
    50%{transform:translateY(6px) rotate(45deg);}
  }

  /* ---------- CONTACT SECTION ---------- */
  .contact{
    background:var(--sand);
    color:var(--ink);
    padding:clamp(60px,10vh,90px) 24px clamp(50px,8vh,72px);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .contact-inner{
    max-width:520px;
    width:100%;
  }
  .contact h2{
    color:var(--navy);
    font-size:clamp(30px, 4.2vw, 42px);
    font-weight:600;
    text-align:center;
  }
  .contact p.sub{
    text-align:center;
    color:var(--ink-soft);
    margin:14px 0 34px;
    font-size:15px;
  }
  form{
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .field label{
    display:block;
    font-size:13px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  .field input,
  .field textarea{
    width:100%;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 16px;
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    font-size:15px;
    outline:none;
    transition:border-color .2s ease, background .2s ease;
  }
  .field input::placeholder,
  .field textarea::placeholder{color:#9AA79E;}
  .field input:focus,
  .field textarea:focus{
    border-color:var(--gold);
    background:var(--white);
  }
  .field textarea{min-height:120px; resize:vertical;}
  .submit-btn{
    margin-top:8px;
    align-self:center;
    padding:15px 42px;
    border-radius:100px;
    border:none;
    background:var(--gold);
    color:var(--white);
    font-family:'Work Sans', sans-serif;
    font-weight:600;
    font-size:15px;
    letter-spacing:0.02em;
    cursor:pointer;
    transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
  }
  .submit-btn:hover{
    background:#B39A66;
    transform:translateY(-2px);
    box-shadow:0 10px 24px rgba(156,133,82,0.35);
  }

  .divider-or{
    display:flex;
    align-items:center;
    gap:16px;
    margin:30px 0 36px;
    color:var(--ink-soft);
    font-size:13px;
    letter-spacing:0.14em;
    text-transform:uppercase;
  }
  .divider-or::before,
  .divider-or::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
  }
  .contact-email{
    display:block;
    text-align:center;
    font-family:'Fraunces', serif;
    font-size:clamp(19px, 2.8vw, 24px);
    font-weight:500;
    color:var(--water);
    transition:color .2s ease;
  }
  .contact-email:hover{color:var(--navy);}

  @media (max-width:560px){
    .brand img{height:76px;}
    .sector-circle{width:104px;height:104px;}
    .sectors{gap:16px;}
    .hero{padding-top:24px;}
  }

  @media (max-height:680px){
    .hero{padding-top:20px; padding-bottom:56px;}
    .brand{margin-bottom:16px;}
    .brand img{height:76px;}
    .tagline{margin-top:16px;}
    .sectors{margin-top:24px;}
  }
</style>
</head>
